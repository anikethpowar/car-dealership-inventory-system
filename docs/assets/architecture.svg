<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="at ad" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="at">System architecture</title>
  <desc id="ad">Flow diagram: a React web app sends requests to a FastAPI server that checks the JWT and role, runs services and SQLAlchemy queries against SQLite, and Alembic manages migrations</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111d36"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#94a3b8" fill-opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
    <marker id="ahAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fbbf24"/>
    </marker>
    <clipPath id="frame"><rect width="1200" height="450" rx="24"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .h{font-size:15px;font-weight:700;fill:#f1f5f9}
      .s{font-size:12px;fill:#94a3b8}
      .band{font-size:11px;font-weight:700;letter-spacing:2.5px}
      .step{font-size:11px;font-weight:700}
      .flow{stroke-dasharray:6 10;animation:flow .9s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-16}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="450" fill="url(#bg)"/>
    <rect width="1200" height="450" fill="url(#dots)"/>

    <!-- header -->
    <g class="sans">
      <text x="48" y="58" font-size="24" font-weight="700" fill="#f8fafc">System architecture</text>
      <text x="48" y="84" font-size="14" fill="#94a3b8">How a single request travels from the browser to the database, and back.</text>
    </g>

    <!-- zone bands -->
    <rect x="40" y="118" width="250" height="282" rx="18" fill="#22d3ee" fill-opacity=".05" stroke="#22d3ee" stroke-opacity=".2"/>
    <rect x="320" y="118" width="560" height="282" rx="18" fill="#a78bfa" fill-opacity=".05" stroke="#a78bfa" stroke-opacity=".2"/>
    <rect x="920" y="118" width="240" height="282" rx="18" fill="#60a5fa" fill-opacity=".05" stroke="#60a5fa" stroke-opacity=".2"/>
    <g class="sans band">
      <text x="64" y="146" fill="#67e8f9">CLIENT</text>
      <text x="344" y="146" fill="#c4b5fd">API SERVER</text>
      <text x="944" y="146" fill="#93c5fd">DATA</text>
    </g>

    <!-- base connector lines -->
    <g stroke="#334155" stroke-width="2" fill="none">
      <path d="M266 255H350"/>
      <path d="M490 255H530"/>
      <path d="M670 255H710"/>
      <path d="M850 255H945"/>
      <path d="M1040 330V300" stroke-dasharray="4 4" stroke="#78520f"/>
    </g>

    <!-- animated flow overlays -->
    <g stroke="#22d3ee" stroke-width="2" fill="none">
      <path class="flow" d="M266 255H350" marker-end="url(#ah)"/>
      <path class="flow" d="M490 255H530" marker-end="url(#ah)"/>
      <path class="flow" d="M670 255H710" marker-end="url(#ah)"/>
      <path class="flow" d="M850 255H945" marker-end="url(#ah)"/>
    </g>
    <path d="M1040 330V300" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ahAmber)"/>
    <text x="1052" y="320" class="sans" font-size="11" fill="#fcd34d">migrates</text>

    <!-- travelling packets: request (cyan) and response (green), drawn behind cards -->
    <g filter="url(#glow)">
      <circle r="4.5" fill="#67e8f9" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="2.6s" repeatCount="indefinite"/>
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M266 255H945"/>
      </circle>
      <circle r="4.5" fill="#34d399" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
        <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M945 255H266"/>
      </circle>
    </g>

    <!-- client card -->
    <rect x="64" y="180" width="202" height="150" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".6" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="165" cy="222" r="24" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/>
    <g transform="translate(153 210)" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2.5"/>
      <path d="M3 9h18M7 6.5h.01M9.5 6.5h.01"/>
    </g>
    <g class="sans" text-anchor="middle">
      <text x="165" y="272" class="h">React Web App</text>
      <text x="165" y="292" class="s">Customer &amp; admin views</text>
      <text x="165" y="310" class="s">Vite · Tailwind · Axios</text>
    </g>

    <!-- FastAPI card -->
    <rect x="350" y="180" width="140" height="150" rx="16" fill="#0f172a" stroke="#2dd4bf" stroke-opacity=".6" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="420" cy="222" r="24" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".45"/>
    <g transform="translate(408 210)" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linejoin="round">
      <path d="M13 2L4.5 13.5H11L10 22l9.5-11.5H13z"/>
    </g>
    <g class="sans" text-anchor="middle">
      <text x="420" y="272" class="h">FastAPI</text>
      <text x="420" y="292" class="s">JWT auth &amp;</text>
      <text x="420" y="310" class="s">role checks</text>
    </g>

    <!-- Services card -->
    <rect x="530" y="180" width="140" height="150" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="600" cy="222" r="24" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".45"/>
    <g transform="translate(588 210)" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round">
      <path d="M12 3l9 5-9 5-9-5z"/>
      <path d="M3 13l9 5 9-5"/>
    </g>
    <g class="sans" text-anchor="middle">
      <text x="600" y="272" class="h">Services</text>
      <text x="600" y="292" class="s">Business rules</text>
      <text x="600" y="310" class="s">&amp; stock logic</text>
    </g>

    <!-- SQLAlchemy card -->
    <rect x="710" y="180" width="140" height="150" rx="16" fill="#0f172a" stroke="#f472b6" stroke-opacity=".6" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="780" cy="222" r="24" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".45"/>
    <g transform="translate(768 210)" fill="none" stroke="#f9a8d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/>
    </g>
    <g class="sans" text-anchor="middle">
      <text x="780" y="272" class="h">SQLAlchemy 2</text>
      <text x="780" y="292" class="s">ORM layer</text>
      <text x="780" y="310" class="s">safe queries</text>
    </g>

    <!-- SQLite card -->
    <rect x="945" y="180" width="190" height="120" rx="16" fill="#0f172a" stroke="#60a5fa" stroke-opacity=".6" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1040" cy="218" r="24" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".45"/>
    <g transform="translate(1028 206)" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="8" ry="3"/>
      <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>
      <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </g>
    <g class="sans" text-anchor="middle">
      <text x="1040" y="272" class="h">SQLite</text>
      <text x="1040" y="292" class="s">Persistent inventory</text>
    </g>

    <!-- Alembic card -->
    <rect x="945" y="330" width="190" height="60" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-opacity=".6" stroke-width="1.5" filter="url(#shadow)"/>
    <g class="sans" text-anchor="middle">
      <text x="1040" y="356" font-size="14" font-weight="700" fill="#fef3c7">Alembic</text>
      <text x="1040" y="374" font-size="11" fill="#fcd34d">Database migrations</text>
    </g>

    <!-- step markers on each hop -->
    <g class="sans step" text-anchor="middle">
      <circle cx="308" cy="232" r="10" fill="#0b1120" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="308" y="236" fill="#5eead4">1</text>
      <circle cx="510" cy="232" r="10" fill="#0b1120" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="510" y="236" fill="#c4b5fd">2</text>
      <circle cx="690" cy="232" r="10" fill="#0b1120" stroke="#f472b6" stroke-width="1.5"/>
      <text x="690" y="236" fill="#f9a8d4">3</text>
      <circle cx="897" cy="232" r="10" fill="#0b1120" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="897" y="236" fill="#93c5fd">4</text>
    </g>

    <!-- legend -->
    <g class="sans" font-size="13" fill="#94a3b8">
      <text x="48" y="436"><tspan font-weight="700" fill="#e2e8f0">1</tspan><tspan dx="8">Request with JWT</tspan></text>
      <text x="260" y="436"><tspan font-weight="700" fill="#e2e8f0">2</tspan><tspan dx="8">Token and role verified</tspan></text>
      <text x="500" y="436"><tspan font-weight="700" fill="#e2e8f0">3</tspan><tspan dx="8">Business rules applied</tspan></text>
      <text x="740" y="436"><tspan font-weight="700" fill="#e2e8f0">4</tspan><tspan dx="8">Safe query to SQLite</tspan></text>
    </g>

    <rect x=".5" y=".5" width="1199" height="449" rx="23.5" fill="none" stroke="#1e293b"/>
  </g>
</svg>
