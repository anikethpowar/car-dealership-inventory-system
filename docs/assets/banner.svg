<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">Car Dealership Inventory System</title>
  <desc id="bd">Animated banner with the project name, its tech stack, and a car driving on a moving road</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111d36"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset=".45" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef9c3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rim">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060b16" stop-opacity="0"/>
      <stop offset=".35" stop-color="#060b16" stop-opacity=".9"/>
      <stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="roadEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#94a3b8" fill-opacity=".14"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .eyebrow{font-size:13px;font-weight:700;letter-spacing:3px}
      .h1{font-size:54px;font-weight:800;letter-spacing:-.5px}
      .lead{font-size:17px}
      .pill{font-size:13px;font-weight:600}
      .beam{animation:glow 2.4s ease-in-out infinite}
      .badge{animation:float 3.2s ease-in-out infinite}
      .dot{animation:drift 7s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.9}50%{opacity:.35}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes drift{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-16px);opacity:.75}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <circle cx="960" cy="150" r="340" fill="url(#glowCyan)"/>
    <circle cx="150" cy="10" r="300" fill="url(#glowViolet)"/>

    <g fill="#67e8f9">
      <circle class="dot" cx="560" cy="70" r="2" style="animation-delay:0s"/>
      <circle class="dot" cx="700" cy="36" r="1.6" style="animation-delay:-2s"/>
      <circle class="dot" cx="1120" cy="48" r="2" style="animation-delay:-4s"/>
      <circle class="dot" cx="1150" cy="210" r="1.6" style="animation-delay:-1s"/>
      <circle class="dot" cx="600" cy="250" r="1.6" style="animation-delay:-5s"/>
    </g>

    <!-- road -->
    <rect y="276" width="1200" height="84" fill="url(#road)"/>
    <rect y="276" width="1200" height="1.5" fill="url(#roadEdge)"/>
    <g>
      <g fill="#e2e8f0" fill-opacity=".22">
        <rect x="0" y="344" width="36" height="4" rx="2"/>
        <rect x="80" y="344" width="36" height="4" rx="2"/>
        <rect x="160" y="344" width="36" height="4" rx="2"/>
        <rect x="240" y="344" width="36" height="4" rx="2"/>
        <rect x="320" y="344" width="36" height="4" rx="2"/>
        <rect x="400" y="344" width="36" height="4" rx="2"/>
        <rect x="480" y="344" width="36" height="4" rx="2"/>
        <rect x="560" y="344" width="36" height="4" rx="2"/>
        <rect x="640" y="344" width="36" height="4" rx="2"/>
        <rect x="720" y="344" width="36" height="4" rx="2"/>
        <rect x="800" y="344" width="36" height="4" rx="2"/>
        <rect x="880" y="344" width="36" height="4" rx="2"/>
        <rect x="960" y="344" width="36" height="4" rx="2"/>
        <rect x="1040" y="344" width="36" height="4" rx="2"/>
        <rect x="1120" y="344" width="36" height="4" rx="2"/>
        <rect x="1200" y="344" width="36" height="4" rx="2"/>
        <rect x="1280" y="344" width="36" height="4" rx="2"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur=".8s" repeatCount="indefinite"/>
    </g>

    <!-- car -->
    <g transform="translate(664 116) scale(1.25)">
      <ellipse cx="170" cy="129" rx="160" ry="4.5" fill="#000" fill-opacity=".45"/>
      <polygon class="beam" points="326,74 400,50 400,114 326,86" fill="url(#beam)"/>
      <circle cx="322" cy="80" r="12" fill="#fef9c3" fill-opacity=".45" filter="url(#blur)"/>

      <path d="M6 96V84Q6 74 18 72L58 68Q86 62 106 40Q118 24 140 24H214Q236 24 250 42L276 64Q300 68 316 74Q326 78 326 90V96Z" fill="url(#carBody)"/>
      <path d="M40 79Q180 72 316 80" fill="none" stroke="#e0f2fe" stroke-opacity=".35" stroke-width="1.6"/>

      <path d="M110 62Q124 38 146 36H178V62Z" fill="url(#glass)"/>
      <path d="M186 36H212Q230 37 240 50L252 64H186Z" fill="url(#glass)"/>
      <path d="M120 58Q126 48 134 42L142 42Q134 50 130 58Z" fill="#fff" fill-opacity=".14"/>
      <path d="M192 40L202 40L190 58L186 58Z" fill="#fff" fill-opacity=".14"/>
      <path d="M182 36V96" stroke="#075985" stroke-width="2"/>

      <rect x="131" y="74" width="10" height="2.5" rx="1.2" fill="#e0f2fe" fill-opacity=".55"/>
      <rect x="200" y="74" width="10" height="2.5" rx="1.2" fill="#e0f2fe" fill-opacity=".55"/>

      <path d="M308 76H322Q324 76 324 78V84Q324 86 322 86H308Z" fill="#fef9c3"/>
      <path d="M6 80H12Q14 80 14 82V90H6Z" fill="#f87171"/>

      <circle cx="82" cy="108" r="25" fill="#03070f"/>
      <circle cx="262" cy="108" r="25" fill="#03070f"/>

      <g transform="translate(82 108)">
        <circle r="20" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
        <circle r="13" fill="url(#rim)"/>
        <g>
          <path d="M0 0V-10M0 0L9.5-3.1M0 0L5.9 8.1M0 0L-5.9 8.1M0 0L-9.5-3.1" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.57s" repeatCount="indefinite"/>
        </g>
        <circle r="2.6" fill="#334155"/>
      </g>

      <g transform="translate(262 108)">
        <circle r="20" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
        <circle r="13" fill="url(#rim)"/>
        <g>
          <path d="M0 0V-10M0 0L9.5-3.1M0 0L5.9 8.1M0 0L-5.9 8.1M0 0L-9.5-3.1" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.57s" repeatCount="indefinite"/>
        </g>
        <circle r="2.6" fill="#334155"/>
      </g>
    </g>

    <!-- stock badge floating above the roof -->
    <g class="badge">
      <rect x="823" y="100" width="124" height="30" rx="15" fill="#052e2b" stroke="#34d399" stroke-opacity=".6"/>
      <circle cx="843" cy="115" r="4" fill="#34d399"/>
      <text x="885" y="120" text-anchor="middle" class="sans pill" fill="#6ee7b7">In stock</text>
    </g>

    <!-- left content -->
    <g class="sans">
      <text x="72" y="74" class="eyebrow" fill="#67e8f9">FULL-STACK · VEHICLE INVENTORY PLATFORM</text>
      <text x="70" y="132" class="h1" fill="#f8fafc">Car Dealership</text>
      <text x="70" y="194" class="h1" fill="url(#titleGrad)">Inventory System</text>
      <text x="72" y="238" class="lead" fill="#94a3b8">Browse, purchase and manage vehicles through a secure API</text>
      <text x="72" y="262" class="lead" fill="#94a3b8">and a responsive React interface.</text>

      <rect x="72" y="286" width="96" height="32" rx="16" fill="#14b8a6" fill-opacity=".14" stroke="#2dd4bf" stroke-opacity=".5"/>
      <text x="120" y="306" text-anchor="middle" class="pill" fill="#99f6e4">FastAPI</text>
      <rect x="180" y="286" width="104" height="32" rx="16" fill="#0ea5e9" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/>
      <text x="232" y="306" text-anchor="middle" class="pill" fill="#a5f3fc">React 19</text>
      <rect x="296" y="286" width="92" height="32" rx="16" fill="#3b82f6" fill-opacity=".14" stroke="#60a5fa" stroke-opacity=".5"/>
      <text x="342" y="306" text-anchor="middle" class="pill" fill="#bfdbfe">SQLite</text>
      <rect x="400" y="286" width="124" height="32" rx="16" fill="#8b5cf6" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/>
      <text x="462" y="306" text-anchor="middle" class="pill" fill="#ddd6fe">JWT · Argon2</text>
      <rect x="536" y="286" width="150" height="32" rx="16" fill="#10b981" fill-opacity=".14" stroke="#34d399" stroke-opacity=".5"/>
      <text x="611" y="306" text-anchor="middle" class="pill" fill="#a7f3d0">28 tests passing</text>
    </g>

    <rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#1e293b"/>
  </g>
</svg>
